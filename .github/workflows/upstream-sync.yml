name: Sync upstream CC Switch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect_release.outputs.version }}
      should_release: ${{ steps.detect_release.outputs.should_release }}
    steps:
      - name: Checkout custom main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge official upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream main
          git checkout main
          git merge --no-edit upstream/main

      - name: Push synchronized main
        run: |
          if git diff --quiet origin/main main; then
            echo "Already up to date."
            exit 0
          fi
          git push origin main

      - name: Detect release version
        id: detect_release
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    if: needs.sync.outputs.should_release == 'true'
    needs: sync
    permissions:
      contents: write
    uses: ./.github/workflows/custom-release.yml
    with:
      version: ${{ needs.sync.outputs.version }}
    secrets: inherit
