name: Sync upstream CC Switch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge official upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream main
          git checkout main
          git merge --no-edit upstream/main

      - name: Push synchronized main
        run: |
          if git diff --quiet origin/main main; then
            echo "Already up to date."
            exit 0
          fi
          git push origin main
